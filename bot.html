          <h2 style="font-size:22px;margin-bottom:10px">Проверьте его способности</h2>
          <p style="color:var(--muted);max-width:560px;margin:0 auto 22px">${bot.demoText}</p>
          <a class="btn btn-cyan btn-lg" href="${bot.demo}" target="_blank" rel="noopener">${ARROW_TG} Открыть демо-бота</a>
          <p style="color:var(--muted);font-size:12.5px;margin-top:14px">Авторский демо-бот · бесплатно, без регистрации</p>
          ${bot.news ? `<p style="color:var(--text-dim);font-size:14px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-soft)">${bot.news}</p>` : ''}
        </section>` : `
        <section class="card demo-card is-soon" style="margin-top:18px">
          <h2 style="font-size:22px;margin-bottom:10px">Проверьте его способности</h2>
          <p style="color:var(--muted)">Авторский демо-бот в разработке.</p>
        </section>`;

      // Скриншоты реальной работы бота, если есть
      const examplesSection = bot.examples ? `
        <section class="card" style="margin-top:18px;padding:30px 26px">
          <h2 style="font-size:22px;text-align:center;margin-bottom:10px">Так может работать ваш бот</h2>
          <p style="color:var(--muted);text-align:center;max-width:560px;margin:0 auto 24px">${bot.examples.intro}</p>
          <div class="shots">
            ${bot.examples.items.map(ex => `
            <figure class="shot">
              <img src="${ex.src}" alt="${ex.alt}" loading="lazy">
              <figcaption>${ex.caption}</figcaption>
            </figure>`).join('')}
          </div>
        </section>` : '';

      page.innerHTML = `
        <section class="card" style="padding:30px 26px">
          <div class="bot-hero">
            <span class="card-icon">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${bot.icon}</svg>
            </span>
            <h1>${bot.title}${bot.hit ? ' <span class="badge badge-cyan" style="vertical-align:middle">Хит</span>' : ''}</h1>
          </div>

          <p style="color:var(--text-dim);font-size:16px;margin-bottom:18px">${bot.about}</p>
          ${bot.price ? `<span class="price-chip"><span class="lbl">Цена</span><span class="sum">${bot.price}</span></span>` : ''}

          <h2 class="sub-h">Что умеет</h2>
          <ul class="checks">${features}</ul>

          ${bot.forWhom ? `
          <h2 class="sub-h">Кому подходит</h2>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${bot.forWhom.map(w => `<span class="tag">${w}</span>`).join('')}</div>` : ''}
        </section>

        ${examplesSection}
        ${demoSection}

        <section class="card" style="margin-top:18px;padding:30px 26px;text-align:center">
          <h2 style="font-size:22px;margin-bottom:8px">Нужен такой бот под вашу задачу?</h2>
          <p style="color:var(--muted);margin-bottom:24px">Два способа на связь — выберите, что подходит задаче</p>

          <div class="grid grid-2" style="text-align:left">
            <div class="card" style="background:var(--panel-2);display:flex;flex-direction:column">
              <h3>Бот @botansfree_bot</h3>
              <p style="flex:1;margin-bottom:16px">Ответы на частые вопросы и ценник на ботов.</p>
              <a class="btn btn-cyan" href="${BOT_URL}" target="_blank" rel="noopener">Написать боту</a>
            </div>
            <div class="card" style="background:var(--panel-2);display:flex;flex-direction:column">
              <h3>Эксперт @botans_free</h3>
              <p style="flex:1;margin-bottom:16px">Для персональных и серьёзных вопросов.</p>
              <a class="btn btn-ghost" href="${CONTACT_URL}" target="_blank" rel="noopener">Написать эксперту</a>
            </div>
          </div>

          <p style="color:var(--muted);font-size:13px;margin-top:22px">Любые ваши правки учтутся</p>
        </section>`;
    }
  </script>
</body>
