server {
    listen 80;
    server_name botansfree.ru www.botansfree.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name botansfree.ru www.botansfree.ru;

    ssl_certificate     /etc/letsencrypt/live/botansfree.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botansfree.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # $uri/ обязан идти перед $uri.html: для голого "/" переменная $uri
        # равна просто "/", и только форма со слэшем заставляет nginx считать
        # это директорией и дойти до директивы index выше. Без неё "/" отдаёт
        # 404, хотя "/index.html" и "/bot.html" открываются нормально.
        try_files $uri $uri/ $uri.html =404;
    }
}
