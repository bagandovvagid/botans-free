# С октября 2026 сам сайт botansfree.ru раздаёт GitHub Pages: зарубежный
# сервер из части российских сетей не открывается, а GitHub — открывается.
# Этот nginx живёт на сервере ботов (Нидерланды) и обслуживает только
# «Читальню» — веб-архив переписок — на поддомене chats.botansfree.ru.

server {
    listen 80;
    server_name chats.botansfree.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chats.botansfree.ru;

    ssl_certificate     /etc/letsencrypt/live/chats.botansfree.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chats.botansfree.ru/privkey.pem;

    # «Читальня» (/root/bot/web/server.py) — отдельный процесс на хосте, слушает
    # шлюз этой же docker-сети. Наружу его порт не опубликован — попасть можно
    # только сюда, через nginx. Путь передаётся как есть: страница отвечает
    # только по секретному префиксу из WEB_PATH, всё остальное — 404.
    location / {
        proxy_pass http://172.18.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Медиа отдаётся потоком и по Range — буферизация тут только мешает.
        proxy_buffering off;
        proxy_request_buffering off;
        # Первое обращение к голосовому запускает перекодировку ffmpeg.
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
}
