version: "3.8"

# nginx перед «Читальней» (веб-архивом переписок) на chats.botansfree.ru,
# certbot держит её сертификат свежим. Сам сайт botansfree.ru раздаёт
# GitHub Pages — его файлы сюда больше не монтируются.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  # Продлевает сертификат Let's Encrypt каждые 12 часов (сам certbot ничего
  # не делает, пока до истечения больше 30 дней).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
